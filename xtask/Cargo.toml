[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.11.1"
hex.workspace = true
tempfile = "3"
toml = "1.1.8"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
percent-encoding = "2"
memchr = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_AppLocker", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
