name: Windows検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_downloads:
        description: 公式パックの実取得と全テーマ変換も検証する
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更範囲の判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 比較元を含むソースを取得する
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 変更範囲の判定を契約試験で確認する
        run: ./scripts/tests/ci-scope-contract.ps1

      - name: 必要な検証を選ぶ
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $scope = & ./scripts/ci-scope.ps1 -EventName $env:CI_EVENT -Base $env:CI_BASE -Head $env:CI_HEAD
          $matrix = if ($scope -ceq 'docs') {
            '{"include":[{"kind":"docs","name":"文書と設定の検証"}]}'
          } else {
            '{"include":[{"kind":"verify","name":"通常検証とGPUI操作試験"},{"kind":"zip","name":"最適化ZIPの生成と検証"}]}'
          }
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "選択した検証: $scope" >> $env:GITHUB_STEP_SUMMARY
          # Gitの差分取得失敗を全検証へ退避した場合も、判定自体は成功とする。
          exit 0

  windows:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - name: 検証したRust版を用意する
        working-directory: ${{ runner.temp }}
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component rust-docs

      - name: 固定版の検証ツールを復元する
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/filehue-tools
          key: windows-x64-rust-1.99.0-just-1.43.0-deny-0.20.2-about-0.9.2-cli

      - name: 固定版の検証ツールを用意する
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TOOL_CACHE 'filehue-tools'
          cargo install just --version 1.43.0 --locked --root $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-deny --version 0.20.2 --locked --root $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-about --version 0.9.2 --features cli --locked --root $toolRoot
          exit $LASTEXITCODE

      - name: 検証ツールをPATHへ追加する
        run: |
          $toolRoot = Join-Path $env:RUNNER_TOOL_CACHE 'filehue-tools'
          "$(Join-Path $toolRoot 'bin')" >> $env:GITHUB_PATH

      - name: 固定版の権利表示ツールを確認する
        working-directory: ${{ runner.temp }}
        run: |
          $version = cargo about --version
          if ($LASTEXITCODE -ne 0 -or $version -cne 'cargo-about 0.9.2') { throw 'cargo-about 0.9.2のCLIを使用できません' }

      - name: 導入済みの検証ツールを保存する
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/filehue-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: ソースを取得する
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ビルドキャッシュの保存先を確認する
        if: matrix.kind != 'docs'
        id: cache-paths
        run: |
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          "registry=$(Join-Path $cargoRoot 'registry')" >> $env:GITHUB_OUTPUT

      # 構成と依存が一致するmainの成果物を再利用し、現在のソースとの差分はCargoが再構築する。
      - name: 依存とビルド結果を復元する
        if: matrix.kind != 'docs'
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-paths.outputs.registry }}
            target
          key: windows-x64-rust-1.99.0-build-v1-${{ matrix.kind }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/windows.yml', 'xtask/src/privacy.rs') }}-${{ github.sha }}
          restore-keys: |
            windows-x64-rust-1.99.0-build-v1-${{ matrix.kind }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/windows.yml', 'xtask/src/privacy.rs') }}-

      - name: 監査・静的解析・モックとGPUI操作試験を実行する
        if: matrix.kind == 'verify'
        run: just verify

      - name: 文書の相対リンクを検査する
        if: matrix.kind == 'verify'
        run: just check-docs

      - name: 文書と設定の依存監査・リンク検査を実行する
        if: matrix.kind == 'docs'
        run: |
          just audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just check-docs
          exit $LASTEXITCODE

      - name: 測定結果の集計を検証する
        if: matrix.kind == 'verify'
        run: cargo test -p file-icons-shell --example measure_shell --locked

      - name: ZIPのビルド前に依存を監査する
        if: matrix.kind == 'zip'
        run: just audit

      - name: 最適化ZIP・権利表示・GUIとCLIを検証する
        if: matrix.kind == 'zip'
        timeout-minutes: 45
        run: just verify-release --skip-shell --report work/ci-release/verification.json

      - name: 公式配布物を取得して検証する
        if: matrix.kind == 'verify' && github.event_name == 'workflow_dispatch' && inputs.verify_downloads
        timeout-minutes: 8
        run: cargo test -p file-icons-catalog --locked -- --ignored --exact tests::official_releases_download_and_compile --nocapture

      - name: CLIから公式配布物を取得して検証する
        if: matrix.kind == 'verify' && github.event_name == 'workflow_dispatch' && inputs.verify_downloads
        timeout-minutes: 8
        run: cargo test -p file-icons-cli --test cli --locked -- --ignored --exact official_downloads_through_real_cli_keep_registration_inactive

      - name: mainの検証に成功したビルド結果を保存する
        if: matrix.kind != 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-paths.outputs.registry }}
            target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  validation:
    # 判定と、選択した全ジョブの成功を既存の必須チェック名で確認する。
    name: WindowsのビルドとGPUI操作試験
    if: always()
    needs: [changes, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 判定と選択した検証の成功を確認する
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULT: ${{ needs.windows.result }}
        run: test "$CHANGES_RESULT" = success && test "$RESULT" = success
