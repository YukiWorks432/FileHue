# cargo-deny 0.20.2の標準設定。例外はsecurity/advisory-exceptions.jsonから一時設定へ追加する。
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P1D"
unused-ignored-advisory = "warn"
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[bans.build]
