function glyph(name, className = '') {
  return `<svg class="glyph ${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]}</svg>`;
}
const folder = '<svg class="file-icon folder-icon" viewBox="0 0 28 28" aria-hidden="true"><path fill="#ffe39a" d="M2 6a2 2 0 0 1 2-2h7l3 3h10a2 2 0 0 1 2 2v13H2Z"/><path fill="#ffd369" d="M2 10h24v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/><path fill="#e8ae3a" d="M2 10h24v2H2Z"/></svg>';
const originalFile = '<svg class="file-icon original-icon" viewBox="0 0 28 28" aria-hidden="true"><path fill="#f3f3f3" stroke="#9c9c9c" stroke-width=".65" d="M6 2.5h10.5l5 5V25H6Z"/><path fill="#cdcdcd" d="m16.5 2.5 5 5h-5Z"/><path stroke="#9eabb4" stroke-width="1" d="M9.5 13h8.5m-8.5 3.5h8.5m-8.5 3.5h6"/></svg>';
function fileIcon(file, state) {
  if (file.folder) return folder;
  if (state === 'before') return originalFile;
  const icon = associations.get(file.name);
  if (!icon) throw new Error(`テーマ定義がありません: ${file.name}`);
  return `<img class="file-icon themed-icon" src="${icon.asset}" alt="" data-definition="${icon.definition}">`;
}

function explorer(lang, state) {
  const t = labels[lang];
  const nav = (name, label, extra = '') => `<div class="nav-item ${extra}">${glyph(name)}<span>${label}</span></div>`;
  return `<div class="explorer" data-state="${state}">
    <div class="titlebar"><div class="tab">${folder}<span>demo-project</span>${glyph('close')}</div><span class="add-tab">${glyph('plus')}</span><div class="window-controls"><i class="minimize"></i><i class="maximize"></i>${glyph('close')}</div></div>
    <div class="navigation"><div class="history">${glyph('left')}${glyph('right', 'disabled')}${glyph('up')}${glyph('refresh')}</div><div class="address">${glyph('pc')}${glyph('chevron')}<span>Projects</span>${glyph('chevron')}<strong>demo-project</strong></div><div class="search"><span>${t.search}</span>${glyph('search')}</div></div>
    <div class="toolbar"><span class="new-item">${glyph('circlePlus')}<span>${t.new}</span>${glyph('down')}</span><i class="separator"></i><span class="tools">${glyph('cut')}${glyph('copy')}${glyph('paste')}${glyph('rename')}${glyph('trash')}</span><i class="separator"></i><span class="toolbar-label">${glyph('sort')}${t.sort}${glyph('down')}</span><span class="toolbar-label">${glyph('view')}${t.view}${glyph('down')}</span><i class="separator"></i>${glyph('more')}</div>
    <div class="window-body"><aside class="sidebar">${nav('home', t.home, 'home-nav')}${nav('gallery', t.gallery, 'gallery-nav')}<div class="nav-divider"></div>${nav('pc', t.desktop)}${nav('download', t.downloads)}${nav('document', t.documents)}<div class="nav-divider"></div>${nav('pc', t.pc, 'pc-nav')}<div class="nav-item drive-item">${glyph('drive')}<span>${t.drive}</span></div>${nav('network', t.network)}</aside>
      <section class="files"><div class="file-header"><span class="name-header"><i class="checkbox"></i>${t.name}<i class="sort-arrow"></i></span><span>${t.type}</span><span class="size-header">${t.size}</span></div><div class="file-rows">${files.map(file => `<div class="file-row"><span class="filename">${fileIcon(file, state)}<span>${file.name}</span></span><span class="file-type">${file.folder ? t.folder : t.itemType(file.type)}</span><span class="file-size">${file.size ?? ''}</span></div>`).join('')}</div></section>
    </div><div class="statusbar"><span>${t.status}</span><span class="status-views">${glyph('view')}${glyph('grid')}</span></div>
  </div>`;
}

:1px;background:#363636;display:block;flex:none}.tools{display:flex;gap:22px;color:#aab2b6}.tools .glyph{width:19px;height:19px;color:#9ca8ae}.toolbar-label{gap:7px}.toolbar-label .glyph{width:20px;height:20px}.toolbar>.glyph{width:22px}

function renderDocument(lang, variant = 'comparison') {
  const t = labels[lang];
  const panel = state => `<section class="panel ${state}"><div class="panel-label"><h1>${t[state]}</h1><p>${t[`${state}Hint`]}</p></div>${explorer(lang, state)}</section>`;
  const content = variant === 'comparison' ? `<main class="sheet"><div class="comparison">${panel('before')}${panel('after')}</div><footer class="caption"><span>${t.note}</span><a class="credit" href="${provenance.source}">${t.license}</a></footer></main>` : `<main class="sheet solo">${explorer(lang, variant)}</main>`;
  return `<!doctype html>\n<html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FileHue Explorer comparison — ${lang}</title><style>${css}</style></head><body>${content}</body></html>\n`;
}

const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ja';
const page = new DOMParser().parseFromString(renderDocument(lang), 'text/html');
document.documentElement.lang = lang;
document.title = page.title;
document.head.append(page.querySelector('style'));
document.body.innerHTML = page.body.innerHTML;
